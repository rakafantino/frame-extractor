<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frame Extractor - Extract Video Frames Online</title>
    <meta
      name="description"
      content="Extract multiple frames from any browser-supported video. Choose a start time, end time, FPS, image format, and download frames individually or as a ZIP."
    />
    <meta
      name="keywords"
      content="frame extractor, video frame extractor, extract frames from video, video to image, video to JPG, video to PNG, video to WebP"
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f766e" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Frame Extractor - Extract Video Frames Online" />
    <meta
      property="og:description"
      content="Extract video frames locally in your browser. Set the exact time range, FPS, and output format, then download images or a ZIP."
    />
    <meta property="og:site_name" content="Frame Extractor" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Frame Extractor - Extract Video Frames Online" />
    <meta
      name="twitter:description"
      content="Extract multiple video frames as JPG, PNG, or WebP directly in your browser."
    />
    <link rel="stylesheet" href="./styles.css" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Frame Extractor",
        "applicationCategory": "MultimediaApplication",
        "operatingSystem": "Any",
        "description": "Extract multiple frames from a video as JPG, PNG, or WebP images directly in the browser.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-labelledby="app-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Local video tool</p>
            <h1 id="app-title">Frame Extractor</h1>
          </div>
          <button id="resetButton" class="icon-button" type="button" title="Reset">
            <span aria-hidden="true">↺</span>
            <span class="sr-only">Reset</span>
          </button>
        </div>

        <div class="layout-grid">
          <section class="panel controls-panel" aria-label="Extraction settings">
            <label class="dropzone" id="dropzone">
              <input id="videoInput" type="file" accept="video/*" />
              <span class="drop-icon" aria-hidden="true">▣</span>
              <span class="drop-title">Choose or drop a video</span>
              <span class="drop-copy">MP4, WebM, MOV, or any video format your browser supports</span>
            </label>

            <div class="video-meta" id="videoMeta" hidden>
              <span id="fileName">No video selected</span>
              <span id="durationText">0s</span>
            </div>

            <div class="field-grid">
              <label class="field">
                <span>Start time (seconds)</span>
                <input id="startInput" type="number" min="0" step="0.01" value="0" />
              </label>
              <label class="field">
                <span>End time (seconds)</span>
                <input id="endInput" type="number" min="0" step="0.01" value="10" />
              </label>
              <label class="field">
                <span>Frames per second</span>
                <input id="fpsInput" type="number" min="0.1" max="60" step="0.1" value="1" />
              </label>
              <label class="field">
                <span>Filename prefix</span>
                <input id="prefixInput" type="text" value="frame" maxlength="48" />
              </label>
            </div>

            <fieldset class="format-group">
              <legend>Output</legend>
              <label>
                <input type="radio" name="format" value="image/jpeg" checked />
                JPG
              </label>
              <label>
                <input type="radio" name="format" value="image/png" />
                PNG
              </label>
              <label>
                <input type="radio" name="format" value="image/webp" />
                WebP
              </label>
            </fieldset>

            <label class="field quality-field" id="qualityField">
              <span class="label-row">
                Quality <strong id="qualityValue">0.92</strong>
                <span
                  class="tooltip"
                  tabindex="0"
                  aria-label="Quality controls JPG and WebP compression. Higher values improve image quality but create larger files."
                >
                  ?
                </span>
              </span>
              <input id="qualityInput" type="range" min="0.1" max="1" step="0.01" value="0.92" />
            </label>

            <div class="summary-strip" aria-live="polite">
              <span id="estimateText">Estimate: 10 frames</span>
              <span id="constraintText">Practical limit: 1,000 frames</span>
            </div>

            <div class="actions">
              <button id="extractButton" class="primary-button" type="button" disabled>
                Extract frames
              </button>
              <button id="zipButton" class="secondary-button" type="button" disabled>
                Download ZIP
              </button>
            </div>

            <div class="progress-wrap" id="progressWrap" hidden>
              <div class="progress-label">
                <span id="progressText">Preparing...</span>
                <span id="progressCount">0%</span>
              </div>
              <progress id="progressBar" value="0" max="100"></progress>
            </div>

            <p class="status" id="statusText" role="status"></p>
          </section>

          <section class="panel preview-panel" aria-label="Preview and extracted frames">
            <video id="videoPreview" controls muted playsinline></video>

            <div class="results-head">
              <div>
                <p class="eyebrow">Results</p>
                <h2 id="resultCount">No frames yet</h2>
              </div>
              <button id="clearButton" class="secondary-button compact" type="button" disabled>
                Clear
              </button>
            </div>

            <div class="frames-scroll" aria-label="Extracted frame list">
              <div id="emptyState" class="empty-state">
                Upload a video, choose a time range, then extract. Everything runs in your browser.
              </div>
              <div id="framesGrid" class="frames-grid" aria-live="polite"></div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
